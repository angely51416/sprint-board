<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>進度儀錶板</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/frappe-gantt@0.6.1/dist/frappe-gantt.css">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="components/loading/loading.css">
<link rel="stylesheet" href="components/header/header.css">
<link rel="stylesheet" href="components/qa-board/qa-board.css">
<link rel="stylesheet" href="components/gantt/gantt.css">
<link rel="stylesheet" href="components/cards/cards.css">
</head>
<body>

<!-- LOADING -->
<div id="loading-state" class="loading">
  <div class="loading__spinner"></div>
  <div class="loading__text">載入專案資料中…</div>
</div>

<!-- MODAL -->
<div class="modal-backdrop" id="qa-modal" onclick="onBackdropClick(event)">
  <div class="modal">
    <div class="modal__title" id="modal-title">新增關注項目</div>
    <label class="modal__label" for="modal-text">項目內容</label>
    <input class="modal__input" id="modal-text" type="text" placeholder="例：🔗 Free Round API 3/20 出貨確認" maxlength="120"
      onkeydown="if(event.key==='Enter')saveModal();if(event.key==='Escape')closeModal();">
    <div class="modal__footer">
      <button class="modal__cancel" onclick="closeModal()">取消</button>
      <button class="modal__save" onclick="saveModal()">儲存</button>
    </div>
  </div>
</div>

<!-- HEADER -->
<header class="page-header">
  <div>
    <div class="page-header__title"><span>QA 專案週報</span><span>進度儀錶板</span></div>
    <div class="page-header__meta" id="pg-meta">—</div>
  </div>
  <div class="page-header__right">
    <div class="page-header__badge" id="pg-badge">—</div>
    <div class="page-header__updated" id="last-updated">—</div>
  </div>
</header>

<!-- ERROR BANNER -->
<div id="load-error" class="load-error">
  <span>⚠️</span>
  <div><strong class="load-error__label">無法載入 data.json</strong><br>請確認 Apps Script 已正確執行，或直接開啟本機版本。</div>
</div>

<!-- QA BOARD -->
<div class="sh">
  <span class="sh__title">本週 QA 重點關注</span>
  <div class="sh__line"></div>
  <button class="qa-add-btn" onclick="openModal()">＋ 新增項目</button>
</div>
<div class="qa-board">
  <div class="qa-col">
    <div class="qa-col__header qa-col__header--todo">⚡ 進行中 / 待處理<span class="qa-col__count" id="todo-count"></span></div>
    <div class="qa-list" id="qa-todo" ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event,'todo')"></div>
  </div>
  <div class="qa-col">
    <div class="qa-col__header qa-col__header--done">✓ 已完成<span class="qa-col__count" id="done-count"></span></div>
    <div class="qa-list" id="qa-done" ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event,'done')"></div>
  </div>
</div>

<!-- GANTT -->
<div class="sh">
  <div class="view-toggle">
    <button class="view-toggle__btn view-toggle__btn--active" id="vt-Day"   onclick="setGanttView('Day',event)">日</button>
    <button class="view-toggle__btn"                          id="vt-Week"  onclick="setGanttView('Week',event)">週</button>
    <button class="view-toggle__btn"                          id="vt-Month" onclick="setGanttView('Month',event)">月</button>
  </div>
  <span class="sh__title">全專案時間軸</span>
  <div class="sh__line"></div>
  <span class="sh__note" id="gantt-note">— 可拖曳長條調整時程</span>
</div>
<div class="gantt-outer">
  <div class="gantt-hd-quarter"><div class="gantt-hd-quarter__label">季度</div><div class="gantt-hd-quarter__cells" id="g-hd-q-cells"></div></div>
  <div class="gantt-hd-month"><div class="gantt-hd-month__label"></div><div class="gantt-hd-month__cells" id="g-hd-m-cells"></div></div>
  <div class="gantt-split">
    <div class="gantt-left">
      <div class="gantt-left__header" id="gantt-left-hd">專案名稱</div>
      <ul class="gantt-label-list" id="gantt-label-list"></ul>
    </div>
    <div class="gantt-right" id="gantt-right">
      <div class="gantt-container"><svg id="gantt-chart"></svg></div>
    </div>
  </div>
</div>

<!-- CARDS -->
<div class="sh">
  <span class="sh__title">所有專案詳情</span>
  <div class="sh__line"></div>
  <span class="sh__note">滑入翻轉查看負責人</span>
</div>
<div class="filter-bar" id="filter-bar"></div>
<div class="all-cards-grid" id="all-cards"></div>

<script src="https://cdn.jsdelivr.net/npm/frappe-gantt@0.6.1/dist/frappe-gantt.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
