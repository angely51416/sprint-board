<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>衝刺看板</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/frappe-gantt@0.6.1/dist/frappe-gantt.css">
<style>
:root {
  /* ── Palette ── */
  --bg:         #F5F2EC;
  --surface:    #FFFFFF;
  --panel:      #EDE7D8;
  --panel-b:    #E3D9C4;
  --border:     #D4C49C;
  --border-dk:  #B8A070;
  --ink:        #1E1C18;
  --ink-2:      #4A4840;
  --ink-3:      #847E72;
  --ink-4:      #B0AA9E;
  --red:        #8C2A1C;
  --red-bg:    #F6EDEB;
  --amber:      #8A5C10; --amb-bg:    #FBF0DC;
  --green:      #244F30; --grn-bg:    #E4EFE6;
  --blue:       #1A3860;
  --blu-bg:    #DDE5F2;
  --teal:       #0D4A44; --teal-bg:   #DCF0EE;
  --purple:     #3A1E60; --pur-bg:    #EAE4F5;
  --accent:     #C89840;
  --accent-2:   #E8B458;
  --dark:       #3A3830;
  --today-hl:   rgba(200,152,64,0.18);
  --today-line: #C89840;
  --week-hl:    rgba(200,152,64,0.09);
  --month-hl:   rgba(200,152,64,0.10);
  /* ── Type ── */
  --mono:  'DM Mono', monospace;
  --sans:  'Noto Sans TC', sans-serif;
  --serif: 'Noto Serif TC', serif;
  /* ── Shape ── */
  --radius: 4px;
  --radius-lg: 8px;
  --shadow: 0 2px 12px rgba(0,0,0,0.07), 0 1px 4px rgba(0,0,0,0.05);
  --shadow-md: 0 4px 24px rgba(0,0,0,0.10), 0 2px 8px rgba(0,0,0,0.06);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{font-size:18px;}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;padding:36px 44px 100px;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border-dk);border-radius:3px;}

/* ── HEADER ── */
.pg-hd{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;padding-bottom:20px;margin-bottom:32px;border-bottom:2px solid var(--border-dk);}
.pg-title{font-family:var(--serif);font-size:2.1rem;font-weight:700;letter-spacing:-0.03em;line-height:1.07;color:var(--ink);}
.pg-title span{display:block;}
.pg-title span:last-child{color:var(--accent);}
.pg-meta{margin-top:7px;font-family:var(--mono);font-size:0.68rem;letter-spacing:0.09em;color:var(--ink-3);}
.pg-badge{font-family:var(--mono);font-size:0.76rem;font-weight:500;letter-spacing:0.07em;color:var(--ink-2);border:1.5px solid var(--border-dk);padding:8px 18px;border-radius:var(--radius);background:var(--surface);}

/* ── QA BOARD ── */
.qa-board{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:40px;}
.qa-col{background:var(--surface);border:1px solid var(--border-dk);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow);}
.qa-col-hd{display:flex;align-items:center;gap:8px;padding:11px 16px;border-bottom:1px solid var(--border);font-family:var(--mono);font-size:0.64rem;font-weight:500;letter-spacing:0.10em;}
.qa-col-hd.todo{color:var(--amber);background:var(--amb-bg);}
.qa-col-hd.done{color:var(--green);background:var(--grn-bg);}
.qa-col-hd .col-count{margin-left:auto;font-size:0.72rem;opacity:0.7;}
.qa-list{min-height:60px;padding:8px;display:flex;flex-direction:column;gap:6px;}
.qa-list.drag-over{background:rgba(97,104,94,0.07);border-radius:4px;}
.qa-chip{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:5px;font-size:0.8rem;font-weight:500;cursor:grab;user-select:none;transition:box-shadow .15s,opacity .15s,transform .12s;border:1px solid var(--border);background:var(--panel);color:var(--ink-2);}
.qa-chip:active{cursor:grabbing;}
.qa-chip.done-item{background:var(--grn-bg);border-color:#A0C4A8;color:var(--green);opacity:0.8;}
.qa-chip.dragging{opacity:0.32;transform:scale(0.97);}
.qa-chip .drag-handle{color:var(--ink-4);font-size:0.74rem;flex-shrink:0;}
.qa-chip .chip-text{flex:1;min-width:0;}
.qa-chip-actions{display:flex;gap:3px;flex-shrink:0;opacity:0;transition:opacity .15s;}
.qa-chip:hover .qa-chip-actions{opacity:1;}
.qa-act-btn{width:22px;height:22px;border:none;border-radius:3px;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:0.7rem;color:var(--ink-3);transition:background .1s,color .1s;}
.qa-act-btn:hover.edit{background:#E4EBF5;color:var(--blue);}
.qa-act-btn:hover.del{background:var(--red-bg);color:var(--red);}
.qa-add-btn{font-family:var(--mono);font-size:0.64rem;font-weight:500;letter-spacing:0.07em;padding:5px 14px;border-radius:var(--radius);background:var(--surface);border:1.5px solid var(--border-dk);color:var(--ink-2);cursor:pointer;white-space:nowrap;transition:background .1s,border-color .1s;}
.qa-add-btn:hover{background:var(--panel);border-color:var(--dark);color:var(--dark);}

/* ── MODAL ── */
.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(20,18,14,0.50);backdrop-filter:blur(4px);z-index:500;align-items:center;justify-content:center;}
.modal-backdrop.open{display:flex;}
.modal{background:var(--surface);border:1px solid var(--border-dk);border-radius:10px;padding:30px 30px 26px;width:460px;max-width:92vw;box-shadow:var(--shadow-md);animation:modalIn .18s ease both;}
@keyframes modalIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.modal-title{font-family:var(--serif);font-size:1.08rem;font-weight:700;color:var(--ink);margin-bottom:20px;}
.modal-label{display:block;font-family:var(--mono);font-size:0.62rem;letter-spacing:0.09em;color:var(--ink-3);margin-bottom:6px;}
.modal-input{width:100%;padding:10px 13px;border-radius:4px;border:1.5px solid var(--border-dk);background:var(--bg);font-family:var(--sans);font-size:0.88rem;color:var(--ink);outline:none;transition:border-color .12s;margin-bottom:18px;}
.modal-input:focus{border-color:var(--dark);}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:4px;}
.modal-cancel{font-family:var(--mono);font-size:0.7rem;padding:8px 17px;border-radius:var(--radius);background:var(--panel);border:1.5px solid var(--border-dk);color:var(--ink-3);cursor:pointer;}
.modal-cancel:hover{background:var(--panel-b);}
.modal-save{font-family:var(--mono);font-size:0.7rem;font-weight:500;padding:8px 20px;border-radius:var(--radius);background:var(--dark);border:1.5px solid var(--dark);color:#FFF;cursor:pointer;transition:background .1s;}
.modal-save:hover{background:#2A2820;}

/* ── SECTION HDR ── */
.sh{display:flex;align-items:center;gap:14px;margin:36px 0 14px;}
.sh-title{font-family:var(--mono);font-size:0.63rem;font-weight:500;letter-spacing:0.15em;color:var(--ink-3);white-space:nowrap;text-transform:uppercase;}
.sh-line{flex:1;height:1px;background:var(--border);}
.sh-note{font-family:var(--mono);font-size:0.62rem;color:var(--ink-4);white-space:nowrap;}

/* ── GANTT OUTER ── */
.gantt-outer{border:1px solid var(--border-dk);border-radius:var(--radius-lg);background:var(--surface);box-shadow:var(--shadow);overflow:hidden;}
.gantt-split{display:grid;grid-template-columns:260px minmax(0,1fr);border-top:1px solid var(--border);}
.gantt-left{border-right:1px solid var(--border);background:var(--panel);overflow:hidden;display:block;}
.gantt-left-hd{padding:9px 14px;border-bottom:1px solid var(--border);font-family:var(--mono);font-size:0.61rem;letter-spacing:0.07em;color:var(--ink-3);display:flex;align-items:center;box-sizing:border-box;}
.gantt-label-list{list-style:none;margin:0;padding:0;position:relative;}
.gantt-label-item{
  display:flex;align-items:center;gap:8px;padding:0 12px;
  border-bottom:1px solid var(--border);color:var(--ink-2);
  font-size:0.81rem;font-weight:500;
  cursor:grab;transition:background .1s;
  position:absolute;left:0;right:0;box-sizing:border-box;
  overflow:hidden;
}
.gantt-label-item:hover{background:rgba(200,152,64,0.12);}
.gantt-label-item.row-dragging{opacity:0.35;}
.gantt-label-item.row-drag-over{border-top:2px solid var(--accent)!important;}
.gantt-drag-hdl{color:var(--ink-4);font-size:0.7rem;flex-shrink:0;cursor:grab;}
.gantt-label-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.3;}
.gantt-right{overflow-x:auto;overflow-y:hidden;position:relative;}

/* ── VIEW TOGGLE ── */
.view-toggle{display:flex;gap:2px;background:var(--panel-b);border:1px solid var(--border-dk);border-radius:4px;padding:2px;flex-shrink:0;}
.vt-btn{font-family:var(--mono);font-size:0.61rem;font-weight:500;letter-spacing:0.07em;padding:4px 12px;border:none;border-radius:3px;cursor:pointer;background:transparent;color:var(--ink-3);transition:background .12s,color .12s;}
.vt-btn.active{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,0.10);}
.vt-btn:hover:not(.active){background:var(--panel);color:var(--ink-2);}

/* ── 季度/月份 header ── */
.g-hd-quarter{display:flex;border-bottom:1px solid rgba(255,255,255,0.08);background:var(--dark);}
.g-hd-quarter-lbl{flex-shrink:0;width:260px;padding:5px 14px;font-family:var(--mono);font-size:0.59rem;font-weight:500;letter-spacing:0.07em;color:rgba(255,255,255,0.4);border-right:1px solid rgba(255,255,255,0.08);box-sizing:border-box;}
.g-hd-quarter-cells{flex:1;position:relative;height:26px;overflow:hidden;}
.g-hd-q-cell{position:absolute;height:26px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:0.61rem;font-weight:500;letter-spacing:0.08em;color:#FFF;border-right:1px solid rgba(255,255,255,0.10);white-space:nowrap;overflow:hidden;box-sizing:border-box;}

.g-hd-month{display:flex;border-bottom:1px solid var(--border);}
.g-hd-month-lbl{flex-shrink:0;width:260px;border-right:1px solid var(--border-dk);background:var(--panel-b);box-sizing:border-box;}
.g-hd-month-cells{flex:1;position:relative;height:28px;overflow:hidden;}
.g-hd-m-cell{position:absolute;height:28px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:0.69rem;font-weight:500;color:var(--ink-2);background:var(--panel-b);border-right:1px solid var(--border);white-space:nowrap;overflow:hidden;box-sizing:border-box;transition:background .2s;}
.g-hd-m-cell.now-month{color:var(--dark);background:#E8D5A0;font-weight:700;}

/* ── 時間線高亮 ── */
.now-line{position:absolute;top:0;bottom:0;width:2px;background:var(--today-line);opacity:1;pointer-events:none;z-index:50;}
.now-line::after{content:'▼';position:absolute;top:-2px;left:50%;transform:translateX(-50%);font-size:7px;color:var(--today-line);line-height:1;}
/* 週高亮帶 */
.week-band{position:absolute;top:0;bottom:0;background:var(--week-hl);pointer-events:none;z-index:10;border-left:1.5px dashed rgba(200,152,64,0.4);border-right:1.5px dashed rgba(200,152,64,0.4);}
/* 月高亮帶 */
.month-band{position:absolute;top:0;bottom:0;background:var(--month-hl);pointer-events:none;z-index:10;border-left:1.5px dashed rgba(200,152,64,0.4);border-right:1.5px dashed rgba(200,152,64,0.4);}

/* ── Frappe overrides ── */
.gantt .bar-label{display:none;}
.gantt .grid-header,.gantt .grid-row{fill:var(--surface);}
.gantt .row-line{stroke:var(--border);}
.gantt .lower-text,.gantt .upper-text{fill:var(--ink-3);}
.gantt .tick{stroke:var(--border);}
.gantt .today-highlight{fill:var(--accent);opacity:0.13;}
.gantt .bar{fill:#C4B090;stroke:#A89060;}
.gantt .bar-progress{fill:#C4B090;}
.gantt-container{padding:0;}
.range-ph .bar,.range-ph .bar-progress{opacity:0!important;}
.gantt-tag-tri{stroke:none;}
.gantt-tag-tri.qa{fill:#8C2A1C;}
.gantt-tag-tri.done{fill:#8A5C10;}
.gantt-tag-bg{fill:var(--surface);stroke:var(--border-dk);stroke-width:1;}
.gantt-tag-text{fill:var(--ink-2);font-family:'DM Mono',monospace;font-size:13px;}

/* ── Filter bar ── */
.filter-bar{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px;}
.filter-btn{font-family:var(--mono);font-size:0.62rem;font-weight:500;letter-spacing:0.05em;padding:4px 14px;border-radius:20px;cursor:pointer;border:1.5px solid var(--border-dk);background:var(--surface);color:var(--ink-3);transition:all .12s;white-space:nowrap;}
.filter-btn:hover{border-color:var(--dark);color:var(--dark);background:var(--panel);}
.filter-btn.active{background:var(--dark);border-color:var(--dark);color:#FFF;}

/* ── CARDS GRID ── */
.all-cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(296px,1fr));gap:1px;background:var(--border);border:1px solid var(--border-dk);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow);}
.flip-card{height:420px;perspective:1000px;animation:rise .35s ease both;}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.flip-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .44s cubic-bezier(0.4,0,0.2,1);}
.flip-card:hover .flip-inner{transform:rotateY(180deg);}
.flip-front,.flip-back{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:17px 17px 13px;display:flex;flex-direction:column;background:var(--surface);overflow:hidden;}
.flip-back{transform:rotateY(180deg);background:var(--dark);color:#FFF;justify-content:center;}
.flip-front::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--pc-color,var(--border));}
.pc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.pc-ico{font-size:23px;}
.pc-pill{font-family:var(--mono);font-size:0.55rem;font-weight:500;letter-spacing:0.05em;padding:3px 8px;border-radius:3px;}
.pc-name{font-size:0.94rem;font-weight:700;color:var(--ink);line-height:1.2;margin-bottom:1px;}
.pc-sub{font-family:var(--mono);font-size:0.63rem;color:var(--ink-4);margin-bottom:8px;}
.pc-prog-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px;}
.pc-prog-lbl{font-family:var(--mono);font-size:0.60rem;letter-spacing:0.08em;color:var(--ink-4);}
.pc-prog-pct{font-family:var(--mono);font-size:0.88rem;font-weight:500;}
.pc-bar-track{height:2px;background:var(--panel-b);margin-bottom:10px;border-radius:1px;overflow:hidden;}
.pc-bar-fill{height:100%;border-radius:1px;}
.pc-dates{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:3px;overflow:hidden;margin-bottom:8px;}
.pc-date{background:var(--panel);padding:6px 8px;}
.pc-date.empty{background:var(--bg);}
.pcd-lbl{font-family:var(--mono);font-size:0.52rem;font-weight:500;letter-spacing:0.07em;color:var(--ink-4);margin-bottom:2px;}
.pcd-val{font-family:var(--mono);font-size:0.78rem;font-weight:500;color:var(--ink);line-height:1;}
.pcd-cnt{font-family:var(--mono);font-size:0.58rem;color:var(--ink-3);margin-top:2px;}
.pcd-cnt.hot{color:var(--red);}
.pc-updates{display:flex;flex-direction:column;gap:3px;overflow:hidden;flex-shrink:1;min-height:0;}
.pc-upd{display:flex;gap:7px;align-items:flex-start;font-size:0.73rem;color:var(--ink-2);line-height:1.38;}
.upd-pip{width:3px;height:3px;border-radius:50%;flex-shrink:0;margin-top:6px;}
.tc-rows{display:flex;flex-direction:column;gap:5px;overflow:hidden;flex-shrink:1;min-height:0;}
.tc-row{display:flex;justify-content:space-between;gap:8px;}
.tc-k{font-family:var(--mono);font-size:0.68rem;color:var(--ink-3);}
.tc-v{font-family:var(--mono);font-size:0.68rem;font-weight:500;color:var(--ink-2);text-align:right;}
.tc-v.hot{color:var(--red);} .tc-v.warn{color:var(--amber);} .tc-v.ok{color:var(--green);}

/* ── 遊戲機制標籤 ── */
.mech-row{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px;margin-bottom:4px;}
.mech-tag{font-family:var(--mono);font-size:0.50rem;font-weight:500;letter-spacing:0.04em;padding:2px 6px;border-radius:3px;white-space:nowrap;border:1px solid transparent;}
.mech-tag.y {background:#E4F0E8;color:#1E4A2A;border-color:#A8D0B0;}
.mech-tag.n {background:#F2F0EC;color:#908C84;border-color:#D4CEC4;}
.mech-tag.na{background:var(--bg);color:var(--ink-4);border-color:var(--border);opacity:0.7;}

/* ── Back side ── */
.back-hint{font-family:var(--mono);font-size:0.61rem;letter-spacing:0.06em;color:rgba(255,255,255,0.40);margin-bottom:11px;}
.back-name{font-family:var(--serif);font-size:1.05rem;font-weight:700;color:#FFF;margin-bottom:2px;line-height:1.2;}
.back-sub{font-family:var(--mono);font-size:0.62rem;color:rgba(255,255,255,0.38);margin-bottom:14px;}
.back-team{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;}
.bt-item{display:flex;flex-direction:column;gap:1px;}
.bt-role{font-family:var(--mono);font-size:0.56rem;letter-spacing:0.06em;color:rgba(255,255,255,0.33);}
.bt-name{font-size:0.82rem;font-weight:700;color:#FFF;}
.back-no-team{font-family:var(--mono);font-size:0.7rem;color:rgba(255,255,255,0.28);margin-top:8px;}
.flip-hint{position:absolute;bottom:8px;right:11px;font-family:var(--mono);font-size:0.53rem;letter-spacing:0.05em;color:var(--ink-4);opacity:0.7;pointer-events:none;}

/* ── Pill colours ── */
.pill-final {background:#E4EDF6;color:#1A3A6A;}
.pill-qa    {background:var(--red-bg);color:var(--red);}
.pill-survey{background:var(--amb-bg);color:var(--amber);}
.pill-audio {background:#EDE6F6;color:#3A1E60;}
.pill-fe    {background:#E2EFF1;color:#0A3840;}
.pill-art   {background:#F1E9E4;color:#4C2616;}
.pill-tech  {background:var(--panel-b);color:var(--ink-2);}

@media(max-width:900px){
  body{padding:20px 16px 60px;}
  .qa-board{grid-template-columns:1fr;}
  .gantt-split{grid-template-columns:180px minmax(0,1fr);}
  .g-hd-quarter-lbl,.g-hd-month-lbl{width:180px;}
}
</style>
</head>
<body>

<div class="modal-backdrop" id="qa-modal" onclick="onBackdropClick(event)">
  <div class="modal">
    <div class="modal-title" id="modal-title">新增關注項目</div>
    <label class="modal-label" for="modal-text">項目內容</label>
    <input class="modal-input" id="modal-text" type="text" placeholder="例：🔗 Free Round API 3/20 出貨確認" maxlength="120"
      onkeydown="if(event.key==='Enter')saveModal();if(event.key==='Escape')closeModal();">
    <div class="modal-footer">
      <button class="modal-cancel" onclick="closeModal()">取消</button>
      <button class="modal-save" onclick="saveModal()">儲存</button>
    </div>
  </div>
</div>

<header class="pg-hd">
  <div>
    <div class="pg-title"><span>QA 專案週報</span><span>衝刺看板</span></div>
    <div class="pg-meta" id="pg-meta">—</div>
  </div>
  <div class="pg-badge" id="pg-badge">—</div>
</header>

<div class="sh">
  <span class="sh-title">本週 QA 重點關注</span>
  <div class="sh-line"></div>
  <button class="qa-add-btn" onclick="openModal()">＋ 新增項目</button>
</div>
<div class="qa-board">
  <div class="qa-col">
    <div class="qa-col-hd todo">⚡ 進行中 / 待處理<span class="col-count" id="todo-count"></span></div>
    <div class="qa-list" id="qa-todo" ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event,'todo')"></div>
  </div>
  <div class="qa-col">

/* ━━━━━━━━━━━━━━━━━━━━━━━━

const TODAY = new Date();

const TODAY_STR = TODAY.getFullYear()+'-'+String(TODAY.getMonth()+1).padStart(2,'0')+'-'+String(TODAY.getDate()).padStart(2,'0');
function isoWeek(d){
  const dt=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const day=dt.getUTCDay()||7; dt.setUTCDate(dt.getUTCDate()+4-day);
  const y1=new Date(Date.UTC(dt.getUTCFullYear(),0,1));
  return Math.ceil((((dt-y1)/86400000)+1)/7);
}
function weekStart(d){ const w=d.getDay()||7; const m=new Date(d); m.setDate(d.getDate()-w+1); return m; }
function weekEnd(d){ const f=new Date(weekStart(d)); f.setDate(f.getDate()+6); return f; }
function monthStart(d){ return new Date(d.getFullYear(),d.getMonth(),1); }
function monthEnd(d){ return new Date(d.getFullYear(),d.getMonth()+1,0); }
function fmtMD(d){ return String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0'); }
function toStr(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

function updateHeader(){
  const wn=isoWeek(TODAY),ws=weekStart(TODAY),we=weekEnd(TODAY);

  const mNames=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  const rS=new Date(yr,mn-2,1),rE=new Date(yr,mn+3,0);
  document.getElementById('gantt-note').textContent=`${mNames[rS.getMonth()]} – ${mNames[rE.getMonth()]} ｜ 可拖曳長條調整時程`;
}

function renderQA(){

/* ━━━━━━━━━━━━━━━━━━━━━━━━
   Gantt & Timeline Custom Headers
━━━━━━━━━━━━━━━━━━━━━━━━ */
function getQ(m){ if(m<=2)return'Q1'; if(m<=5)return'Q2'; if(m<=8)return'Q3'; return'Q4'; }
function renderTimelineHeaders(){
  const qCells=document.getElementById('g-hd-q-cells');
  const mCells=document.getElementById('g-hd-m-cells');
  qCells.innerHTML=''; mCells.innerHTML='';
  
  let totalDays=Math.round((RANGE_E-RANGE_S)/86400000)+1;
  let pxPerDay=0;
  if(curView==='Day') pxPerDay=60;
  else if(curView==='Week') pxPerDay=140/7;
  else pxPerDay=120/30;
  
  // Months Loop
  let curr=new Date(RANGE_S);
  while(curr<=RANGE_E){
    let ms=monthStart(curr), me=monthEnd(curr);
    if(ms<RANGE_S) ms=new Date(RANGE_S);
    if(me>RANGE_E) me=new Date(RANGE_E);
    let days=(me-ms)/86400000+1;
    let w=days*pxPerDay;
    let l=Math.round((ms-RANGE_S)/86400000)*pxPerDay;
    
    let isNow=(curr.getFullYear()===TODAY.getFullYear()&&curr.getMonth()===TODAY.getMonth());
    let mNames=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
    let d=document.createElement('div'); d.className=`g-hd-m-cell ${isNow?'now-month':''}`;
    d.style.left=l+'px'; d.style.width=w+'px';
    d.textContent=`${curr.getFullYear()} ${mNames[curr.getMonth()]}`;
    mCells.appendChild(d);
    
    curr.setMonth(curr.getMonth()+1);
  }
  
  // Quarters Loop
  curr=new Date(RANGE_S);
  while(curr<=RANGE_E){
    let q=getQ(curr.getMonth());
    let yr=curr.getFullYear();
    let qS=new Date(yr, q==='Q1'?0:q==='Q2'?3:q==='Q3'?6:9, 1);
    let qE=new Date(yr, q==='Q1'?2:q==='Q2'?5:q==='Q3'?8:11, 31);
    if(qS<RANGE_S) qS=new Date(RANGE_S);
    if(qE>RANGE_E) qE=new Date(RANGE_E);
    let days=(qE-qS)/86400000+1;
    let w=days*pxPerDay;
    let l=Math.round((qS-RANGE_S)/86400000)*pxPerDay;
    
    let d=document.createElement('div'); d.className='g-hd-q-cell';
    d.style.left=l+'px'; d.style.width=w+'px';
    d.textContent=`${yr} ${q}`;
    qCells.appendChild(d);
    
    curr.setMonth(curr.getMonth()+3);
  }
}

function syncCustomBands(){
  const container=document.getElementById('gantt-right');
  document.querySelectorAll('.now-line, .week-band, .month-band').forEach(el=>el.remove());
  
  let pxPerDay=0;
  if(curView==='Day') pxPerDay=60;
  else if(curView==='Week') pxPerDay=140/7;
  else pxPerDay=120/30;
  
  const totalDays=Math.round((RANGE_E-RANGE_S)/86400000)+1;
  const gw=totalDays*pxPerDay;
  
  // Now Line
  if(TODAY>=RANGE_S&&TODAY<=RANGE_E){
    let left=Math.round((TODAY-RANGE_S)/86400000)*pxPerDay;
    let nl=document.createElement('div'); nl.className='now-line'; nl.style.left=left+'px';
    container.appendChild(nl);
  }
  
  // Week Band (Current Week)
  let wS=weekStart(TODAY), wE=weekEnd(TODAY);
  if(!(wE<RANGE_S || wS>RANGE_E)){
    let clipS=wS<RANGE_S?RANGE_S:wS, clipE=wE>RANGE_E?RANGE_E:wE;
    let left=Math.round((clipS-RANGE_S)/86400000)*pxPerDay;
    let w=((clipE-clipS)/86400000+1)*pxPerDay;
    let wb=document.createElement('div'); wb.className='week-band'; wb.style.left=left+'px'; wb.style.width=w+'px';
    container.appendChild(wb);
  }
  
  // Month Band (Current Month)
  let mS=monthStart(TODAY), mE=monthEnd(TODAY);
  if(!(mE<RANGE_S || mS>RANGE_E)){
    let clipS=mS<RANGE_S?RANGE_S:mS, clipE=mE>RANGE_E?RANGE_E:mE;
    let left=Math.round((clipS-RANGE_S)/86400000)*pxPerDay;
    let w=((clipE-clipS)/86400000+1)*pxPerDay;
    let mb=document.createElement('div'); mb.className='month-band'; mb.style.left=left+'px'; mb.style.width=w+'px';
    container.appendChild(mb);
  }
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━
   Gantt Core Functions
━━━━━━━━━━━━━━━━━━━━━━━━ */
function makeTasks(){
  taskMeta={};
  return projOrder.map((it, idx)=>{
    let s=tlStart(it), e=tlEnd(it);
    if(new Date(s)>new Date(e)) e=s;
    let tId='t_'+idx;
    taskMeta[tId]=it;
    return {
      id: tId, name: it.name, start: s, end: e, progress: Math.round((it.progress||0)*100),
      dependencies: '', custom_class: it.kind==='tech'?'range-ph':''
    };
  });
}

function syncLeftLabelPositions(){
  setTimeout(()=>{
    const svg=document.getElementById('gantt-chart');
    if(!svg)return;
    const rows=svg.querySelectorAll('.grid-row');
    const list=document.getElementById('gantt-label-list');
    list.innerHTML='';
    
    rows.forEach((row, i)=>{
      const tId='t_'+i;
      const it=taskMeta[tId];
      if(!it)return;
      const rTop=row.getAttribute('y')||0;
      const rH=row.getAttribute('height')||0;
      
      let li=document.createElement('li');
      li.className='gantt-label-item';
      li.style.top=rTop+'px';
      li.style.height=rH+'px';
      li.setAttribute('draggable','true');
      li.setAttribute('data-idx', i);
      
      li.ondragstart=(e)=>{
        e.dataTransfer.setData('text/plain', i);
        li.classList.add('row-dragging');
      };
      li.ondragend=()=>{ li.classList.remove('row-dragging'); document.querySelectorAll('.gantt-label-item').forEach(el=>el.classList.remove('row-drag-over')); };
      li.ondragover=(e)=>{ e.preventDefault(); li.classList.add('row-drag-over'); };
      li.ondragleave=()=>{ li.classList.remove('row-drag-over'); };
      li.ondrop=(e)=>{
        e.preventDefault();
        let fromIdx=parseInt(e.dataTransfer.getData('text/plain'),10);
        let toIdx=i;
        if(fromIdx!==toIdx){
          let moved=projOrder.splice(fromIdx,1)[0];
          projOrder.splice(toIdx,0,moved);
          initGantt();
        }
      };
      
      let ico=it.kind==='game'?(it.emoji||'🎮'):(it.icon||'⚙️');
      li.innerHTML=`<span class="gantt-drag-hdl">⠿</span><span style="font-size:15px;flex-shrink:0;">${ico}</span><span class="gantt-label-name">${it.name}</span>`;
      list.appendChild(li);
    });
    
    const sH=svg.getAttribute('height')||'auto';
    document.querySelector('.gantt-left').style.height=sH+'px';
  }, 50);
}

function initGantt(){
  const tks=makeTasks();
  if(!tks.length){
    document.getElementById('gantt-chart').innerHTML='';
    document.getElementById('gantt-label-list').innerHTML='';
    return;
  }
  
  // Custom Triangular Tag Extension for Frappe Gantt
  FrappeGantt.prototype.draw_triangles=function(){
    const svg=this.$svg;
    svg.querySelectorAll('.gantt-tag-group').forEach(el=>el.remove());
    
    this.tasks.forEach(task=>{
      const meta=taskMeta[task.id];
      if(!meta)return;
      const bar=this.bars[task.id];
      if(!bar)return;
      
      let datesToCheck=[];
      if(meta.kind==='game'){
        if(meta.qa) datesToCheck.push({d:meta.qa, type:'qa', lbl:'进测'});
        if(meta.testDone) datesToCheck.push({d:meta.testDone, type:'done', lbl:'測畢'});
      }else if(meta.kind==='tech'){
        if(meta.qa) datesToCheck.push({d:meta.qa, type:'qa', lbl:'進測'});
        if(meta.testDone) datesToCheck.push({d:meta.testDone, type:'done', lbl:'測畢'});
      }
      
      datesToCheck.forEach(node=>{
        let days=Math.round((new Date(node.d)-this.gantt_start)/86400000);
        let cx=days*this.options.column_width + this.options.column_width/2;
        let cy=bar.$bar.getAttribute('y')*1 + bar.$bar.getAttribute('height')/2;
        
        let g=document.createElementNS('http://www.w3.org/2000/svg','g');
        g.setAttribute('class','gantt-tag-group');
        
        let tri=document.createElementNS('http://www.w3.org/2000/svg','polygon');
        let sz=7;
        let pts=`${cx},${cy-sz} ${cx-sz},${cy+sz} ${cx+sz},${cy+sz}`;
        tri.setAttribute('points',pts);
        tri.setAttribute('class',`gantt-tag-tri ${node.type}`);
        
        let bg=document.createElementNS('http://www.w3.org/2000/svg','rect');
        let tw=node.lbl.length*13+10, th=20;
        bg.setAttribute('x', cx-tw/2); bg.setAttribute('y', cy+sz+3);
        bg.setAttribute('width', tw); bg.setAttribute('height', th);
        bg.setAttribute('rx', 3); bg.setAttribute('class', 'gantt-tag-bg');
        
        let txt=document.createElementNS('http://www.w3.org/2000/svg','text');
        txt.setAttribute('x', cx); txt.setAttribute('y', cy+sz+17);
        txt.setAttribute('text-anchor', 'middle'); txt.setAttribute('class', 'gantt-tag-text');
        txt.textContent=node.lbl;
        
        g.appendChild(tri); g.appendChild(bg); g.appendChild(txt);
        svg.appendChild(g);
      });
    });
  };
  
  const origRender=FrappeGantt.prototype.render;
  FrappeGantt.prototype.render=function(){
    origRender.call(this);
    this.draw_triangles();
  };
  
  ganttInst=new FrappeGantt('#gantt-chart', tks, {
    view_mode: curView,
    column_width: curView==='Day'?60:curView==='Week'?140:120,
    row_height: 52,
    header_height: 0, // completely custom headers
    start_date: RANGE_S_STR,
    end_date: RANGE_E_STR,
    on_date_change: (task, start, end)=>{
      const it=taskMeta[task.id];
      if(!it)return;
      let diffS=Math.round((start-new Date(tlStart(it)))/86400000);
      let diffE=Math.round((end-new Date(tlEnd(it)))/86400000);
      
      function shift(ds, days){ if(!ds)return null; let d=new Date(ds); d.setDate(d.getDate()+days); return toStr(d); }
      if(it.kind==='game'){
        it.qa=shift(it.qa, diffS); it.testDone=shift(it.testDone, diffE);
        it.ship=shift(it.ship, diffE); it.live=shift(it.live, diffE);
      }else{
        it.qa=shift(it.qa, diffS); it.testDone=shift(it.testDone, diffE);
        it.ship=shift(it.ship, diffE); it.prod=shift(it.prod, diffE);
      }
      ganttInst.draw_triangles();
      renderCards();
    }
  });
  
  renderTimelineHeaders();
  syncCustomBands();
  syncLeftLabelPositions();
  
  // Center chart view smoothly to current month band
  if(curView==='Day'||curView==='Week'){
    setTimeout(()=>{
      const mBand=document.querySelector('.month-band');
      const out=document.getElementById('gantt-right');
      if(mBand&&out) out.scrollLeft = mBand.offsetLeft - out.offsetWidth/3;
    }, 60);
  }
}

function setGanttView(v, e){
  curView=v;
  document.querySelectorAll('.vt-btn').forEach(b=>b.classList.remove('active'));
  if(e) e.target.classList.add('active');
  else document.getElementById('vt-'+v).classList.add('active');
  initGantt();
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━
   Cards Details & Filters
━━━━━━━━━━━━━━━━━━━━━━━━ */
let curFilter="";
function initFilters(){
  const bar=document.getElementById('filter-bar');
  const lbls=["全部","基本測試完成","基本測試中","COCOS串接","QA測試中","待開發"];
  bar.innerHTML=lbls.map((l,i)=>`<button class="filter-btn ${((!curFilter&&i===0)||curFilter===l)?'active':''}" onclick="setFilter('${i===0?'':l}',event)">${l}</button>`).join('');
}
function setFilter(f,e){
  curFilter=f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active');
  renderCards();
}

function teamBack(t){
  if(t.kind==='tech') return`<div class="flip-back"><div class="back-hint">▷ 滑出返回正面</div><div class="back-name">${t.name}</div><div class="back-sub">${t.en}</div><div class="back-no-team">— 技術研發專案無固定人員面板 —</div></div>`;
  const m=t.team||{};
  const keys=[{k:'GP',n:'策劃'},{k:'FE',n:'前端'},{k:'GS',n:'服務端'},{k:'Info',n:'維運'},{k:'HIS',n:'歷史單'}];
  const grid=keys.map(x=>`<div class="bt-item"><span class="bt-role">${x.n}</span><span class="bt-name">${m[x.k]||'--'}</span></div>`).join('');
  return`<div class="flip-back"><div class="back-hint">▷ 滑出返回正面</div><div class="back-name">${t.name}</div><div class="back-sub">${t.en}</div><div class="back-team">${grid}</div></div>`;
}

function renderCards(){
  function dateCell(title, valStr, isHotIfLeft){
    if(!valStr) return`<div class="pc-date empty"><div class="pcd-lbl">${title}</div><div class="pcd-val" style="color:var(--ink-4)">--</div></div>`;
    let left=daysLeft(valStr);
    let remStr=left===0?'今天':left>0?`${left}天後`:`${Math.abs(left)}天前`;
    let cls=(isHotIfLeft&&left<=3&&left>=0)?'hot':'';
    return`<div class="pc-date"><div class="pcd-lbl">${title}</div><div class="pcd-val">${shortDate(valStr)}</div><div class="pcd-cnt ${cls}">${remStr}</div></div>`;
  }
  
  function gameFront(t){
    const doneL=t.done.map(x=>`<div class="pc-upd"><span class="upd-pip" style="background:var(--green)"></span><div class="chip-text">${x}</div></div>`).join('');
    const wipL=t.wip.map(x=>`<div class="pc-upd"><span class="upd-pip" style="background:var(--accent)"></span><div class="chip-text">${x}</div></div>`).join('');
    const m=t.mechs||{};
    const keys=[{k:'extraBet',n:'EB'},{k:'blitz',n:'Blitz'},{k:'frb',n:'FRB'},{k:'tournament',n:'聯賽'},{k:'fra',n:'FRA'},{k:'guarantee',n:'保底'},{k:'scPayout',n:'SC'}];
    const tags=keys.map(x=>{ let val=m[x.k]; let cls=val===true?'y':val===false?'n':'na'; return`<span class="mech-tag ${cls}">${x.n}</span>`; }).join('');
    
    return`<div class="flip-front" style="--pc-color:${t.color}">
      <div class="pc-top"><span class="pc-ico">${t.emoji||'🎮'}</span><span class="pc-pill ${PILL[t.status]||'pill-tech'}">${t.statusLabel}</span></div>
      <div class="pc-name">${t.name}</div><div class="pc-sub">#${t.id} · ${t.en}</div>
      <div class="pc-prog-row"><span class="pc-prog-lbl">測試進度</span><span class="pc-prog-pct">${Math.round(t.progress*100)}%</span></div>
      <div class="pc-bar-track"><div class="pc-bar-fill" style="width:${t.progress*100}%;background:${t.color}"></div></div>
      <div class="pc-dates">${dateCell('QA進測',t.qa,true)}${dateCell('預計測畢',t.testDone,true)}${dateCell('上線日',t.live,false)}</div>
      <div style="font-family:var(--mono);font-size:0.53rem;color:var(--ink-4);margin-bottom:2px;font-weight:500;">支援機制</div>
      <div class="mech-row">${tags}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;overflow:hidden;flex:1;min-height:0;margin-top:2px;">
        <div class="pc-updates"><div class="pc-prog-lbl" style="margin-bottom:2px">✓ 本週已完成</div>${doneL}</div>
        <div class="pc-updates"><div class="pc-prog-lbl" style="margin-bottom:2px">⚡ 進行中項目</div>${wipL}</div>
      </div>
      <span class="flip-hint">▷ 滑入翻轉查看負責人</span></div>`;
  }
  
  function techFront(t){
    const rows=(t.rows||[]).map(r=>`<div class="tc-row"><span class="tc-k">${r.k}</span><span class="tc-v ${r.cls}">${r.v}</span></div>`).join('');
    return`<div class="flip-front" style="--pc-color:${t.color}">
      <div class="pc-top"><span class="pc-ico">${t.icon}</span><span class="pc-pill pill-tech">${t.statusLabel}</span></div>
      <div class="pc-name">${t.name}</div><div class="pc-sub">${t.en}</div>
      <div class="pc-dates">${dateCell('QA 進測',t.qa,true)}${dateCell('出貨',t.ship,true)}${dateCell('正式上線',t.prod,false)}</div>
      <div class="tc-rows">${rows}</div>
      <span class="flip-hint">▷ 滑入翻轉查看負責人</span></div>`;
  }
  
  const filtered=curFilter?projOrder.filter(it=>(it.statusLabel||'').includes(curFilter)):projOrder;
  document.getElementById('all-cards').innerHTML=filtered.map((item,i)=>{
    const front=item.kind==='game'?gameFront(item):techFront(item);
    return`<div class="flip-card" style="animation-delay:${i*0.05}s"><div class="flip-inner">${front}${teamBack(item)}</div></div>`;
  }).join('')||'<div style="padding:24px;color:var(--ink-4);font-family:var(--mono);font-size:0.8rem;text-align:center;grid-column:1/-1">— 無符合條件的專案 —</div>';
}

/* ── Init ── */
updateHeader();
initOrder();
renderQA();
initFilters();
initGantt();
renderCards();

window.addEventListener('resize', ()=>{
  if(ganttInst){
    renderTimelineHeaders();
    syncCustomBands();
    syncLeftLabelPositions();
  }
});
</script>
</body>
</html>
